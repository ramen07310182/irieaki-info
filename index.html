<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>入江亜季 情報まとめ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f3f1ed;
            color: #333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Kaku Gothic ProN",
                "Hiragino Sans",
                "Yu Gothic",
                Meiryo,
                sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        header {
            background: linear-gradient(135deg,
                    #ffffff,
                    #f8f5ef);

            border-radius: 16px;

            padding: 24px 20px;

            margin-bottom: 24px;

            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.08);

            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        h1 {
            margin: 0;

            font-size: 24px;

            line-height: 1.4;

            letter-spacing: 0.03em;
        }

        .description {
            margin: 8px 0 0;

            color: #777;

            font-size: 14px;
        }

        /* =====================================================
           ニュース一覧
           ===================================================== */

        .news-list {
            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        /* =====================================================
           ニュースカード
           ===================================================== */

        .news-item {
            position: relative;

            background: #ffffff;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.06);

            border: 1px solid rgba(0, 0, 0, 0.04);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .news-item:hover {
            transform: translateY(-2px);

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.09);
        }

        /* =====================================================
           NEW記事
           ===================================================== */

        .news-item.is-new {
            background:
                linear-gradient(135deg,
                    #fffaf7,
                    #ffffff);

            border-left: 5px solid #ff5a5f;

            box-shadow:
                0 4px 16px rgba(255, 90, 95, 0.16);
        }

        /* =====================================================
           NEWバッジ
           ===================================================== */

        .new-badge {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            margin-left: 8px;

            padding: 3px 8px;

            border-radius: 999px;

            background:
                linear-gradient(135deg,
                    #ff4d5a,
                    #ff7a59);

            color: #ffffff;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.08em;

            vertical-align: middle;

            box-shadow:
                0 2px 6px rgba(255, 77, 90, 0.25);
        }

        /* =====================================================
           日付
           ===================================================== */

        .news-date {
            color: #888;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .news-item.is-new .news-date {
            color: #e05258;

            font-weight: 600;
        }

        /* =====================================================
           タイトル
           ===================================================== */

        .news-title {
            margin: 0 0 11px;

            font-size: 17px;

            line-height: 1.6;

            font-weight: 600;
        }

        .news-item.is-new .news-title {
            color: #222;
        }

        /* =====================================================
           source
           ===================================================== */

        .news-source {
            display: inline-block;

            background: #eee;

            color: #555;

            border-radius: 6px;

            padding: 3px 8px;

            font-size: 12px;

            margin-bottom: 12px;
        }

        .news-item.is-new .news-source {
            background: #fff0ed;

            color: #c84e54;
        }

        /* =====================================================
           リンク
           ===================================================== */

        .news-link {
            display: block;

            text-align: center;

            background: #333;

            color: white;

            text-decoration: none;

            border-radius: 9px;

            padding: 10px;

            font-size: 14px;

            transition:
                background 0.15s ease,
                opacity 0.15s ease;
        }

        .news-link:hover {
            background: #555;
        }

        .news-link:active {
            opacity: 0.7;
        }

        /* =====================================================
           NEW記事のリンク
           ===================================================== */

        .news-item.is-new .news-link {
            background:
                linear-gradient(135deg,
                    #e94b55,
                    #f36b55);
        }

        .news-item.is-new .news-link:hover {
            opacity: 0.9;
        }

        /* =====================================================
           ステータス
           ===================================================== */

        .status {
            background: white;

            border-radius: 14px;

            padding: 20px;

            text-align: center;

            color: #666;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.05);
        }

        .error {
            color: #c00;
        }

        /* =====================================================
           更新時刻
           ===================================================== */

        .updated {
            margin-top: 16px;

            text-align: center;

            color: #888;

            font-size: 12px;
        }

        /* =====================================================
           スマートフォン
           ===================================================== */

        @media (max-width: 600px) {

            .container {
                padding:
                    14px 12px 30px;
            }

            header {
                padding: 20px 17px;

                margin-bottom: 18px;
            }

            h1 {
                font-size: 21px;
            }

            .news-item {
                padding: 16px;
            }

            .news-title {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>

            <h1>
                入江亜季 情報まとめ
            </h1>

            <p class="description">
                入江亜季さんに関する最新情報
            </p>

        </header>


        <main>

            <div id="news-list" class="news-list">

                <div class="status">
                    ニュースを読み込んでいます...
                </div>

            </div>


            <div id="updated" class="updated"></div>

        </main>

    </div>


    <script>

        /* =====================================================
           7日以内か判定
           ===================================================== */

        function isNewArticle(dateString) {

            if (!dateString) {
                return false;
            }

            /*
             * news.jsonの日付
             *
             * 2026-08-31
             *
             * を想定
             */

            const articleDate =
                new Date(
                    dateString + "T00:00:00"
                );


            if (
                Number.isNaN(
                    articleDate.getTime()
                )
            ) {
                return false;
            }


            /*
             * 今日
             */

            const today = new Date();

            today.setHours(
                0,
                0,
                0,
                0
            );


            /*
             * 7日前
             */

            const sevenDaysAgo =
                new Date(today);

            sevenDaysAgo.setDate(
                today.getDate() - 6
            );


            /*
             * 今日を含めて7日以内
             *
             * 例：
             *
             * 8/31 → NEW
             * 8/30 → NEW
             * 8/29 → NEW
             * 8/28 → NEW
             * 8/27 → NEW
             * 8/26 → NEW
             * 8/25 → NEW
             *
             * 8/24 → NEWではない
             */

            return (
                articleDate >= sevenDaysAgo
                &&
                articleDate <= today
            );
        }


        /* =====================================================
           ニュース読み込み
           ===================================================== */

        async function loadNews() {

            const newsList =
                document.getElementById(
                    "news-list"
                );

            const updated =
                document.getElementById(
                    "updated"
                );


            try {

                /*
                 * GitHub Pages上の
                 *
                 * data/news.json
                 *
                 * を読み込む
                 *
                 * timestampを付けて
                 * キャッシュを防止
                 */

                const response =
                    await fetch(
                        "data/news.json?timestamp="
                        + Date.now()
                    );


                if (!response.ok) {

                    throw new Error(
                        "news.jsonを読み込めませんでした。"
                    );
                }


                const news =
                    await response.json();


                newsList.innerHTML = "";


                if (
                    !Array.isArray(news)
                    ||
                    news.length === 0
                ) {

                    newsList.innerHTML = `
                        <div class="status">
                            現在ニュースはありません。
                        </div>
                    `;

                    return;
                }


                /*
                 * 日付の新しい順
                 */

                news.sort(
                    (a, b) =>
                        new Date(b.date)
                        -
                        new Date(a.date)
                );


                /*
                 * ニュース表示
                 */

                for (
                    const item of news
                ) {

                    const article =
                        document.createElement(
                            "article"
                        );


                    article.className =
                        "news-item";


                    /*
                     * 7日以内ならNEW
                     */

                    const isNew =
                        isNewArticle(
                            item.date
                        );


                    if (isNew) {

                        article.classList.add(
                            "is-new"
                        );

                    }


                    /*
                     * NEWバッジ
                     */

                    const newBadge =
                        isNew
                            ? `<span class="new-badge">NEW</span>`
                            : "";


                    article.innerHTML = `

                        <div class="news-date">
                            ${escapeHtml(
                        item.date
                    )}
                            ${newBadge}
                        </div>


                        <h2 class="news-title">
                            ${escapeHtml(
                        item.title
                    )}
                        </h2>


                        <div class="news-source">
                            ${escapeHtml(
                        item.source
                    )}
                        </div>


                        <a
                            class="news-link"
                            href="${escapeAttribute(
                        item.url
                    )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            元記事を見る
                        </a>

                    `;


                    newsList.appendChild(
                        article
                    );
                }


                /*
                 * ページ確認時刻
                 */

                const now =
                    new Date();


                updated.textContent =
                    "ページ確認時刻: "
                    +
                    now.toLocaleString(
                        "ja-JP"
                    );


            } catch (error) {

                console.error(
                    error
                );


                newsList.innerHTML = `

                    <div class="status error">
                        ニュースの読み込みに失敗しました。
                    </div>

                `;
            }
        }


        /* =====================================================
           HTML特殊文字を安全に表示
           ===================================================== */

        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value ?? "";


            return div.innerHTML;
        }


        /* =====================================================
           URL属性を安全にする
           ===================================================== */

        function escapeAttribute(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                );
        }


        /* =====================================================
           ページ読み込み時
           ===================================================== */

        loadNews();

    </script>

</body>

</html>
