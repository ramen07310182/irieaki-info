<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>入江亜季 情報まとめ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Kaku Gothic ProN",
                "Hiragino Sans",
                "Yu Gothic",
                Meiryo,
                sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.4;
        }

        .description {
            margin: 8px 0 0;
            color: #666;
            font-size: 14px;
        }

        /*
         * =====================================================
         * sourceごとのセクション
         * =====================================================
         */

        .source-section {
            margin-bottom: 12px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        /*
         * =====================================================
         * source見出し
         * =====================================================
         */

        .source-header {
            width: 100%;
            border: none;
            background: white;
            padding: 16px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            cursor: pointer;

            color: #333;
            font-size: 18px;
            font-weight: bold;
            text-align: left;
        }

        .source-header:active {
            background: #f5f5f5;
        }

        /*
         * 矢印
         */

        .source-arrow {
            font-size: 16px;
            color: #777;

            transition:
                transform 0.2s ease;
        }

        /*
         * 展開時に矢印を回転
         */

        .source-section.open .source-arrow {
            transform: rotate(90deg);
        }

        /*
         * =====================================================
         * ニュース一覧
         * =====================================================
         */

        .source-content {
            display: none;
            padding: 0 12px 12px;
        }

        /*
         * sourceが開いている場合
         */

        .source-section.open .source-content {
            display: block;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /*
         * =====================================================
         * ニュースカード
         * =====================================================
         */

        .news-item {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 18px;
            border: 1px solid #eee;
        }

        .news-date {
            color: #888;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .news-title {
            margin: 0 0 10px;
            font-size: 17px;
            line-height: 1.6;
        }

        .news-source {
            display: inline-block;
            background: #eee;
            color: #555;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .news-link {
            display: block;
            text-align: center;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
        }

        .news-link:active {
            opacity: 0.7;
        }

        /*
         * =====================================================
         * ステータス
         * =====================================================
         */

        .status {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #666;
        }

        .error {
            color: #c00;
        }

        /*
         * =====================================================
         * 最終更新
         * =====================================================
         */

        .updated {
            margin-top: 20px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>


<body>

    <div class="container">

        <!-- =================================================
             ヘッダー
        ================================================== -->

        <header>

            <h1>
                入江亜季 情報まとめ
            </h1>

            <p class="description">
                入江亜季さんに関する最新情報
            </p>

        </header>


        <!-- =================================================
             ニュース表示
        ================================================== -->

        <main>

            <div id="news-list">

                <div class="status">
                    ニュースを読み込んでいます...
                </div>

            </div>

            <div id="updated" class="updated"></div>

        </main>

    </div>


    <script>

        // ====================================================
        // ニュース読み込み
        // ====================================================

        async function loadNews() {

            const newsList =
                document.getElementById("news-list");

            const updated =
                document.getElementById("updated");

            try {

                /*
                 * GitHub Pages上の
                 *
                 * data/news.json
                 *
                 * を読み込む
                 *
                 * timestampを付けて
                 * キャッシュを防止
                 */

                const response = await fetch(
                    "data/news.json?timestamp=" + Date.now()
                );


                // =================================================
                // HTTPエラー
                // =================================================

                if (!response.ok) {

                    throw new Error(
                        "news.jsonを読み込めませんでした。"
                    );
                }


                // =================================================
                // JSON読み込み
                // =================================================

                const news =
                    await response.json();


                newsList.innerHTML = "";


                // =================================================
                // データ確認
                // =================================================

                if (
                    !Array.isArray(news)
                    ||
                    news.length === 0
                ) {

                    newsList.innerHTML = `
                        <div class="status">
                            現在ニュースはありません。
                        </div>
                    `;

                    return;
                }


                // =================================================
                // 日付の新しい順に並べる
                // =================================================

                news.sort(
                    (a, b) =>
                        new Date(b.date) -
                        new Date(a.date)
                );


                // =================================================
                // sourceごとにグループ化
                // =================================================

                const groupedNews = {};


                for (const item of news) {

                    /*
                     * sourceがないデータは
                     * 「その他」として扱う
                     */

                    const source =
                        item.source || "その他";


                    if (!groupedNews[source]) {

                        groupedNews[source] = [];

                    }


                    groupedNews[source].push(
                        item
                    );

                }


                // =================================================
                // sourceごとに表示
                // =================================================

                for (
                    const [source, items]
                    of Object.entries(groupedNews)
                ) {

                    // =================================================
                    // sourceセクション
                    // =================================================

                    const section =
                        document.createElement(
                            "section"
                        );

                    section.className =
                        "source-section";


                    // =================================================
                    // sourceヘッダー
                    // =================================================

                    const header =
                        document.createElement(
                            "button"
                        );

                    header.className =
                        "source-header";

                    header.type =
                        "button";


                    // =================================================
                    // source名
                    // =================================================

                    const sourceName =
                        document.createElement(
                            "span"
                        );

                    sourceName.textContent =
                        source;


                    // =================================================
                    // 矢印
                    // =================================================

                    const arrow =
                        document.createElement(
                            "span"
                        );

                    arrow.className =
                        "source-arrow";

                    arrow.textContent =
                        "▶";


                    header.appendChild(
                        sourceName
                    );

                    header.appendChild(
                        arrow
                    );


                    // =================================================
                    // ヘッダークリック
                    // =================================================

                    header.addEventListener(
                        "click",
                        () => {

                            section.classList.toggle(
                                "open"
                            );

                        }
                    );


                    // =================================================
                    // コンテンツ
                    // =================================================

                    const content =
                        document.createElement(
                            "div"
                        );

                    content.className =
                        "source-content";


                    // =================================================
                    // ニュース一覧
                    // =================================================

                    const newsContainer =
                        document.createElement(
                            "div"
                        );

                    newsContainer.className =
                        "news-list";


                    // =================================================
                    // 各ニュース
                    // =================================================

                    for (
                        const item
                        of items
                    ) {

                        const article =
                            document.createElement(
                                "article"
                            );

                        article.className =
                            "news-item";


                        article.innerHTML = `

                            <div class="news-date">
                                ${escapeHtml(
                            item.date
                        )}
                            </div>

                            <h2 class="news-title">
                                ${escapeHtml(
                            item.title
                        )}
                            </h2>

                            <div class="news-source">
                                ${escapeHtml(
                            item.source
                        )}
                            </div>

                            <a
                                class="news-link"
                                href="${escapeAttribute(
                            item.url
                        )}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                元記事を見る
                            </a>

                        `;


                        newsContainer.appendChild(
                            article
                        );

                    }


                    // =================================================
                    // コンテンツに追加
                    // =================================================

                    content.appendChild(
                        newsContainer
                    );


                    // =================================================
                    // セクションに追加
                    // =================================================

                    section.appendChild(
                        header
                    );

                    section.appendChild(
                        content
                    );


                    // =================================================
                    // ページに追加
                    // =================================================

                    newsList.appendChild(
                        section
                    );

                }


                // =================================================
                // ページ確認時刻
                // =================================================

                const now =
                    new Date();


                updated.textContent =
                    "ページ確認時刻: " +
                    now.toLocaleString(
                        "ja-JP"
                    );


            } catch (error) {

                console.error(error);


                newsList.innerHTML = `
                    <div class="status error">
                        ニュースの読み込みに失敗しました。
                    </div>
                `;

            }

        }


        // ====================================================
        // HTML特殊文字を安全に表示
        // ====================================================

        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        // ====================================================
        // URL属性用の文字列を安全にする
        // ====================================================

        function escapeAttribute(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                );

        }


        // ====================================================
        // ページを開いたときにニュースを取得
        // ====================================================

        loadNews();

    </script>

</body>

</html>
