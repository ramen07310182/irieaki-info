<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>入江亜季 情報まとめ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
        }

        header {
            background: #333;
            color: white;
            padding: 20px 16px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 6px 0 0;
            font-size: 13px;
            opacity: 0.8;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .section h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .info {
            padding: 14px 0;
            border-top: 1px solid #eee;
        }

        .info:first-child {
            border-top: none;
        }

        .date {
            font-size: 12px;
            color: #888;
        }

        .title {
            margin-top: 5px;
            font-size: 16px;
            font-weight: bold;
        }

        .message {
            color: #777;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 30px 16px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <header>
        <h1>入江亜季 情報まとめ</h1>
        <p>最新情報をチェック</p>
    </header>

    <main>

        <section class="section">
            <h2>🆕 新着情報</h2>

            <div class="info">
                <div class="date">2026/08/30</div>
                <div class="title">現在、情報を収集中です</div>
                <div class="message">
                    今後、ここに自動収集した情報が表示されます。
                </div>
            </div>

        </section>

        <section class="section">
            <h2>📚 作品情報</h2>

            <div class="info">
                <div class="title">作品情報</div>
                <div class="message">
                    今後、作品に関する情報を追加します。
                </div>
            </div>

        </section>

    </main>

    <footer>
        入江亜季 情報まとめ
    </footer>

</body>

</html>
