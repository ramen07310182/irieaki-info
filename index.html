<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>入江亜季 情報まとめ</title>

    <style>
        /* =====================================================
           基本設定
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            background:
                linear-gradient(180deg,
                    #eef2f5 0%,
                    #f5f3ef 100%);

            color: #263238;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Kaku Gothic ProN",
                "Hiragino Sans",
                "Yu Gothic",
                Meiryo,
                sans-serif;
        }


        /* =====================================================
           全体
        ===================================================== */

        .container {
            max-width: 820px;

            margin: 0 auto;

            padding:
                24px 16px 50px;
        }


        /* =====================================================
           ヘッダー
        ===================================================== */

        header {

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(135deg,
                    #263b4a 0%,
                    #344f61 100%);

            color: white;

            border-radius: 18px;

            padding:
                30px 24px 28px;

            margin-bottom: 24px;

            box-shadow:
                0 8px 24px rgba(38, 59, 74, 0.18);
        }


        /*
         * ヘッダーの飾り
         */

        header::after {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -70px;
            top: -80px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.06);
        }


        h1 {

            position: relative;

            z-index: 1;

            margin: 0;

            font-size: 26px;

            font-weight: 700;

            letter-spacing: 0.04em;

            line-height: 1.4;
        }


        .description {

            position: relative;

            z-index: 1;

            margin:
                10px 0 0;

            color:
                rgba(255, 255, 255, 0.78);

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================================================
           sourceセクション
        ===================================================== */

        .source-section {

            margin-bottom: 14px;

            border-radius: 14px;

            overflow: hidden;

            background: rgba(255, 255, 255, 0.72);

            border:
                1px solid rgba(38, 59, 74, 0.08);

            box-shadow:
                0 4px 14px rgba(38, 59, 74, 0.07);
        }


        /* =====================================================
           sourceヘッダー
        ===================================================== */

        .source-header {

            width: 100%;

            border: none;

            background:
                linear-gradient(135deg,
                    #ffffff 0%,
                    #f4f7f9 100%);

            padding:
                17px 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            cursor: pointer;

            color: #263b4a;

            font-size: 17px;

            font-weight: 700;

            text-align: left;

            transition:
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .source-header:hover {

            background:
                linear-gradient(135deg,
                    #f8fafb 0%,
                    #eaf0f4 100%);
        }


        .source-header:active {

            background: #e8eef2;
        }


        /* =====================================================
           source名
        ===================================================== */

        .source-name {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        /*
         * source左側のアクセント
         */

        .source-name::before {

            content: "";

            display: block;

            width: 4px;

            height: 22px;

            border-radius: 4px;

            background:
                #58788c;
        }


        /* =====================================================
           件数
        ===================================================== */

        .source-count {

            margin-left: auto;

            margin-right: 12px;

            min-width: 28px;

            padding:
                3px 8px;

            border-radius: 20px;

            background:
                #e5edf2;

            color:
                #587080;

            font-size: 12px;

            font-weight: 600;

            text-align: center;
        }


        /* =====================================================
           矢印
        ===================================================== */

        .source-arrow {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 28px;
            height: 28px;

            border-radius: 50%;

            background:
                #edf2f5;

            color:
                #587080;

            font-size: 12px;

            transition:
                transform 0.25s ease,
                background 0.2s ease;
        }


        /*
         * 展開時
         */

        .source-section.open .source-arrow {

            transform:
                rotate(90deg);

            background:
                #dce7ed;
        }


        /* =====================================================
           sourceコンテンツ
        ===================================================== */

        .source-content {

            display: none;

            padding:
                4px 12px 14px;
        }


        .source-section.open .source-content {

            display: block;
        }


        /* =====================================================
           ニュース一覧
        ===================================================== */

        .news-list {

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        /* =====================================================
           ニュースカード
        ===================================================== */

        .news-item {

            background:
                #ffffff;

            border-radius: 12px;

            padding:
                17px 16px;

            border:
                1px solid #edf0f2;

            box-shadow:
                0 2px 8px rgba(38, 59, 74, 0.05);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        .news-item:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 5px 14px rgba(38, 59, 74, 0.09);
        }


        /* =====================================================
           日付
        ===================================================== */

        .news-date {

            display: inline-block;

            margin-bottom: 7px;

            color:
                #87949c;

            font-size: 12px;

            letter-spacing:
                0.03em;
        }


        /* =====================================================
           タイトル
        ===================================================== */

        .news-title {

            margin:
                0 0 12px;

            color:
                #263238;

            font-size: 16px;

            font-weight: 600;

            line-height: 1.65;
        }


        /* =====================================================
           source表示
        ===================================================== */

        .news-source {

            display: inline-block;

            background:
                #eef3f6;

            color:
                #617784;

            border-radius: 5px;

            padding:
                3px 8px;

            margin-bottom: 12px;

            font-size: 11px;

            font-weight: 500;
        }


        /* =====================================================
           元記事ボタン
        ===================================================== */

        .news-link {

            display: block;

            text-align: center;

            background:
                #344f61;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            padding:
                10px;

            font-size: 13px;

            font-weight: 600;

            letter-spacing:
                0.02em;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }


        .news-link:hover {

            background:
                #263b4a;
        }


        .news-link:active {

            transform:
                scale(0.98);

            opacity:
                0.85;
        }


        /* =====================================================
           ステータス
        ===================================================== */

        .status {

            background:
                rgba(255, 255, 255, 0.9);

            border-radius:
                14px;

            padding:
                24px;

            text-align:
                center;

            color:
                #71808a;

            box-shadow:
                0 4px 14px rgba(38, 59, 74, 0.06);
        }


        .error {

            color:
                #b44b4b;
        }


        /* =====================================================
           最終更新
        ===================================================== */

        .updated {

            margin-top:
                22px;

            text-align:
                center;

            color:
                #8b969d;

            font-size:
                11px;

            letter-spacing:
                0.03em;
        }


        /* =====================================================
           スマートフォン
        ===================================================== */

        @media (max-width: 600px) {

            .container {

                padding:
                    14px 12px 36px;
            }


            header {

                padding:
                    24px 20px;

                margin-bottom:
                    18px;

                border-radius:
                    16px;
            }


            h1 {

                font-size:
                    23px;
            }


            .description {

                font-size:
                    13px;
            }


            .source-section {

                margin-bottom:
                    10px;

                border-radius:
                    12px;
            }


            .source-header {

                padding:
                    15px 14px;

                font-size:
                    16px;
            }


            .source-content {

                padding:
                    3px 8px 10px;
            }


            .news-item {

                padding:
                    15px 14px;

                border-radius:
                    10px;
            }


            .news-title {

                font-size:
                    15px;
            }


            .news-link {

                padding:
                    10px;
            }

        }
    </style>

</head>


<body>

    <div class="container">


        <!-- =================================================
             ヘッダー
        ================================================== -->

        <header>

            <h1>
                入江亜季 情報まとめ
            </h1>

            <p class="description">
                入江亜季さんに関する最新情報
            </p>

        </header>


        <!-- =================================================
             ニュース表示
        ================================================== -->

        <main>

            <div id="news-list">

                <div class="status">
                    ニュースを読み込んでいます...
                </div>

            </div>


            <div id="updated" class="updated">
            </div>

        </main>

    </div>


    <script>


        // ====================================================
        // ニュース読み込み
        // ====================================================

        async function loadNews() {

            const newsList =
                document.getElementById(
                    "news-list"
                );

            const updated =
                document.getElementById(
                    "updated"
                );


            try {


                // =================================================
                // news.json読み込み
                // =================================================

                const response =
                    await fetch(
                        "data/news.json?timestamp="
                        + Date.now()
                    );


                if (!response.ok) {

                    throw new Error(
                        "news.jsonを読み込めませんでした。"
                    );

                }


                const news =
                    await response.json();


                newsList.innerHTML = "";


                // =================================================
                // データ確認
                // =================================================

                if (
                    !Array.isArray(news)
                    ||
                    news.length === 0
                ) {

                    newsList.innerHTML = `

                        <div class="status">
                            現在ニュースはありません。
                        </div>

                    `;

                    return;
                }


                // =================================================
                // 日付の新しい順
                // =================================================

                news.sort(
                    (a, b) =>
                        new Date(b.date)
                        -
                        new Date(a.date)
                );


                // =================================================
                // sourceごとにグループ化
                // =================================================

                const groupedNews = {};


                for (
                    const item
                    of news
                ) {

                    const source =
                        item.source
                        ||
                        "その他";


                    if (
                        !groupedNews[source]
                    ) {

                        groupedNews[source] =
                            [];

                    }


                    groupedNews[source].push(
                        item
                    );

                }


                // =================================================
                // sourceごとに表示
                // =================================================

                for (
                    const [source, items]
                    of Object.entries(
                        groupedNews
                    )
                ) {


                    // =================================================
                    // セクション
                    // =================================================

                    const section =
                        document.createElement(
                            "section"
                        );

                    section.className =
                        "source-section";


                    // =================================================
                    // ヘッダー
                    // =================================================

                    const header =
                        document.createElement(
                            "button"
                        );

                    header.type =
                        "button";

                    header.className =
                        "source-header";


                    // =================================================
                    // source名
                    // =================================================

                    const sourceName =
                        document.createElement(
                            "span"
                        );

                    sourceName.className =
                        "source-name";

                    sourceName.textContent =
                        source;


                    // =================================================
                    // 件数
                    // =================================================

                    const sourceCount =
                        document.createElement(
                            "span"
                        );

                    sourceCount.className =
                        "source-count";

                    sourceCount.textContent =
                        items.length;


                    // =================================================
                    // 矢印
                    // =================================================

                    const arrow =
                        document.createElement(
                            "span"
                        );

                    arrow.className =
                        "source-arrow";

                    arrow.textContent =
                        "▶";


                    // =================================================
                    // ヘッダーへ追加
                    // =================================================

                    header.appendChild(
                        sourceName
                    );

                    header.appendChild(
                        sourceCount
                    );

                    header.appendChild(
                        arrow
                    );


                    // =================================================
                    // クリックで開閉
                    // =================================================

                    header.addEventListener(
                        "click",
                        () => {

                            section.classList.toggle(
                                "open"
                            );

                        }
                    );


                    // =================================================
                    // コンテンツ
                    // =================================================

                    const content =
                        document.createElement(
                            "div"
                        );

                    content.className =
                        "source-content";


                    // =================================================
                    // ニュース一覧
                    // =================================================

                    const newsContainer =
                        document.createElement(
                            "div"
                        );

                    newsContainer.className =
                        "news-list";


                    // =================================================
                    // 各ニュース
                    // =================================================

                    for (
                        const item
                        of items
                    ) {

                        const article =
                            document.createElement(
                                "article"
                            );

                        article.className =
                            "news-item";


                        article.innerHTML = `

                            <div class="news-date">
                                ${escapeHtml(
                            item.date
                        )}
                            </div>

                            <h2 class="news-title">
                                ${escapeHtml(
                            item.title
                        )}
                            </h2>

                            <div class="news-source">
                                ${escapeHtml(
                            item.source
                        )}
                            </div>

                            <a
                                class="news-link"
                                href="${escapeAttribute(
                            item.url
                        )}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                元記事を見る
                            </a>

                        `;


                        newsContainer.appendChild(
                            article
                        );

                    }


                    // =================================================
                    // コンテンツ追加
                    // =================================================

                    content.appendChild(
                        newsContainer
                    );


                    // =================================================
                    // セクション追加
                    // =================================================

                    section.appendChild(
                        header
                    );

                    section.appendChild(
                        content
                    );


                    newsList.appendChild(
                        section
                    );

                }


                // =================================================
                // ページ確認時刻
                // =================================================

                const now =
                    new Date();


                updated.textContent =
                    "ページ確認時刻: "
                    +
                    now.toLocaleString(
                        "ja-JP"
                    );


            }
            catch (error) {

                console.error(
                    error
                );


                newsList.innerHTML = `

                    <div class="status error">
                        ニュースの読み込みに失敗しました。
                    </div>

                `;

            }

        }


        // ====================================================
        // HTML特殊文字を安全に表示
        // ====================================================

        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value ?? "";


            return div.innerHTML;

        }


        // ====================================================
        // URL属性用
        // ====================================================

        function escapeAttribute(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                );

        }


        // ====================================================
        // ページ読み込み時に実行
        // ====================================================

        loadNews();


    </script>

</body>

</html>
