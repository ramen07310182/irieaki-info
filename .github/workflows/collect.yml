
name: 入江亜季 情報自動収集

on:
  schedule:
    # 日本時間 午前6時
    # UTCでは前日の21時
    - cron: "0 21 * * *"

    # 日本時間 午後6時
    # UTCでは9時
    - cron: "0 9 * * *"

  # GitHub上から手動実行できるようにする
  workflow_dispatch:


jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # GitHubのリポジトリを取得
      # =====================================================

      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4


      # =====================================================
      # Pythonを準備
      # =====================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # 必要なライブラリをインストール
      # =====================================================

      - name: 必要なライブラリをインストール
        run: |
          pip install requests beautifulsoup4


      # =====================================================
      # 北北西に曇と往け
      # =====================================================

      - name: 北北西に曇と往けを収集
        run: |
          python collectors/hokuhokusei.py


      # =====================================================
      # コミックナタリー
      # =====================================================

      - name: コミックナタリーを収集
        run: |
          python collectors/comic_natalie.py


      # =====================================================
      # アニメイトタイムズ
      # =====================================================

      - name: アニメイトタイムズを収集
        run: |
          python collectors/animate_times.py


      # =====================================================
      # KADOKAWA
      # =====================================================

      - name: KADOKAWAを収集
        run: |
          python collectors/kadokawa.py


      # =====================================================
      # news.jsonに変更があったらGitHubへ保存
      # =====================================================

      - name: news.jsonをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json

          git diff --cached --quiet || git commit -m "自動更新: ニュース情報を収集"

          git push
